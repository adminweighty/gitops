apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rightproperty-staging
resources:
  - ../../base
  - ingress.yaml
  - postgres.yaml
  - elasticsearch.yaml
  - minio.yaml
  - worker.yaml
images:
  - name: rightproperty-frontend
    newName: ghcr.io/adminweighty/rightproperty365-frontend
    newTag: sha-f81ca6e710a4e37a6e3f7d1209b5e3ae5b82399b
  - name: rightproperty-api
    newName: ghcr.io/adminweighty/rightproperty365backend
    newTag: sha-bdcbe1bf5172850726dd6778a400699d291d3039
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (api|frontend)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (api|worker)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: APP_ENV
            value: staging
          # Test site only: the sign-in code 1234 is also accepted. The API refuses to
          # start with this set outside development and staging.
          - name: AUTH_DEMO_CODE
            value: "1234"
          - name: WEB_BASE_URL
            value: https://staging.rightproperty365.com
          - name: CORS_ALLOWED_ORIGINS
            value: https://staging.rightproperty365.com
          - name: RESEND_API_KEY
            valueFrom:
              secretKeyRef:
                name: resend-credentials
                key: RESEND_API_KEY
                optional: true
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: api-database
                key: DATABASE_URL
          # Listing search uses Elasticsearch (environments/staging/elasticsearch.yaml).
          # The API falls back to PostgreSQL for a request if Elasticsearch fails.
          - name: SEARCH_DRIVER
            value: elasticsearch
          - name: ELASTICSEARCH_URL
            value: http://elasticsearch:9200
          - name: ELASTICSEARCH_API_KEY
            valueFrom:
              secretKeyRef:
                name: elasticsearch-credentials
                key: ELASTICSEARCH_API_KEY
          # Uploaded files use the private AWS S3 bucket. Credentials are provisioned outside Git.
          - name: STORAGE_DRIVER
            value: s3
          - name: S3_ENDPOINT
            value: https://s3.eu-north-1.amazonaws.com
          - name: S3_BUCKET
            valueFrom:
              secretKeyRef:
                name: aws-s3-credentials
                key: AWS_S3_BUCKET
          - name: S3_REGION
            valueFrom:
              secretKeyRef:
                name: aws-s3-credentials
                key: AWS_REGION
          - name: S3_USE_PATH_STYLE
            value: "true"
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: aws-s3-credentials
                key: AWS_ACCESS_KEY_ID
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: aws-s3-credentials
                key: AWS_SECRET_ACCESS_KEY
          # Links in emails and logo URLs. WEB_BASE_URL above is the older name for the same setting.
          - name: PUBLIC_WEB_URL
            value: https://staging.rightproperty365.com
