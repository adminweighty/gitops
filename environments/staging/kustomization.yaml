apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rightproperty-staging
resources:
  - ../../base
  - ingress.yaml
  - postgres.yaml
  - elasticsearch.yaml
  - minio.yaml
  - worker.yaml
images:
  - name: rightproperty-frontend
    newName: ghcr.io/adminweighty/rightproperty365-frontend
    newTag: sha-a014ad955a8a05442c1b4fef4a99786dc308ea01
  - name: rightproperty-api
    newName: ghcr.io/adminweighty/rightproperty365backend
    newTag: sha-273884d9a6ddd7522d4299d16f25ec08941589be
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (api|worker)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: APP_ENV
            value: staging
          - name: WEB_BASE_URL
            value: https://staging.rightproperty365.com
          - name: CORS_ALLOWED_ORIGINS
            value: https://staging.rightproperty365.com
          - name: RESEND_API_KEY
            valueFrom:
              secretKeyRef:
                name: resend-credentials
                key: RESEND_API_KEY
                optional: true
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: api-database
                key: DATABASE_URL
          # Listing search uses Elasticsearch (environments/staging/elasticsearch.yaml).
          # The API falls back to PostgreSQL for a request if Elasticsearch fails.
          - name: SEARCH_DRIVER
            value: elasticsearch
          - name: ELASTICSEARCH_URL
            value: http://elasticsearch:9200
          - name: ELASTICSEARCH_API_KEY
            valueFrom:
              secretKeyRef:
                name: elasticsearch-credentials
                key: ELASTICSEARCH_API_KEY
          # Uploaded files (onboarding documents) go to MinIO (environments/staging/minio.yaml).
          - name: STORAGE_DRIVER
            value: s3
          - name: S3_ENDPOINT
            value: http://minio:9000
          - name: S3_BUCKET
            value: rightproperty-staging-private
          - name: S3_REGION
            value: us-east-1
          - name: S3_USE_PATH_STYLE
            value: "true"
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: S3_ACCESS_KEY
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: S3_SECRET_KEY
          # Links in emails and logo URLs. WEB_BASE_URL above is the older name for the same setting.
          - name: PUBLIC_WEB_URL
            value: https://staging.rightproperty365.com
