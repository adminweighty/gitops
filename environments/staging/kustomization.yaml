apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rightproperty-staging
resources:
  - ../../base
  - ingress.yaml
  - postgres.yaml
images:
  - name: rightproperty-frontend
    newName: ghcr.io/adminweighty/rightproperty365-frontend
    newTag: sha-dc8fa98c03e9a4a8f2712a2653f82bc41be557a3
  - name: rightproperty-api
    newName: ghcr.io/adminweighty/rightproperty365backend
    newTag: sha-62f5a3cec822aeb66cb4615b2db0abef3ee6fc38
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: APP_ENV
            value: staging
          - name: WEB_BASE_URL
            value: https://staging.rightproperty365.com
          - name: CORS_ALLOWED_ORIGINS
            value: https://staging.rightproperty365.com
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: api-database
                key: DATABASE_URL
