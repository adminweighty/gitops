apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rightproperty-staging
resources:
  - ../../base
  - ingress.yaml
  - postgres.yaml
images:
  - name: rightproperty-frontend
    newName: ghcr.io/adminweighty/rightproperty365-frontend
    newTag: sha-e0277e98c135af185347fd2f4dcce3d82e40ff56
  - name: rightproperty-api
    newName: ghcr.io/adminweighty/rightproperty365backend
    newTag: sha-558f45d2790f6cbc2c84c52646d3e77a446c5702
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: APP_ENV
            value: staging
          - name: WEB_BASE_URL
            value: https://staging.rightproperty365.com
          - name: CORS_ALLOWED_ORIGINS
            value: https://staging.rightproperty365.com
          - name: RESEND_API_KEY
            value: re_ZcJcGLh2_FgF65a1TGNp5QpTag3ZjZxpT
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: api-database
                key: DATABASE_URL
