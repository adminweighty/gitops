apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rightproperty-staging
resources:
  - ../../base
  - ingress.yaml
  - postgres.yaml
images:
  - name: rightproperty-frontend
    newName: ghcr.io/adminweighty/rightproperty365-frontend
    newTag: sha-e0277e98c135af185347fd2f4dcce3d82e40ff56
  - name: rightproperty-api
    newName: ghcr.io/adminweighty/rightproperty365backend
    newTag: sha-1513bb08dc7381237a7755398393e5f83efb5816
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: APP_ENV
            value: staging
          - name: WEB_BASE_URL
            value: https://staging.rightproperty365.com
          - name: CORS_ALLOWED_ORIGINS
            value: https://staging.rightproperty365.com
          - name: RESEND_API_KEY
            valueFrom:
              secretKeyRef:
                name: resend-credentials
                key: RESEND_API_KEY
                optional: true
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: api-database
                key: DATABASE_URL
