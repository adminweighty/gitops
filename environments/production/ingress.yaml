apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rightproperty
spec:
  ingressClassName: traefik
  # HTTPS is terminated by host Nginx before proxying to Traefik.
  rules:
    - host: rightproperty365.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.rightproperty365.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
