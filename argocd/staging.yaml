apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rightproperty-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adminweighty/gitops.git
    targetRevision: main
    path: environments/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: rightproperty-staging
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
